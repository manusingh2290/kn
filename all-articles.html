<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Articles - Kumple News</title>
  <link rel="icon" href="Kumple News.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100 font-sans">
  <header class="bg-indigo-700 text-white py-4 text-center text-2xl font-bold">All Articles</header>
  
  <div class="max-w-5xl mx-auto px-4 mt-6">
    
    <input type="text" id="searchBox" placeholder="Search articles..."
      class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
  </div>

  <main class="max-w-5xl mx-auto p-4">
    <div id="post-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script src="gitignore.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const postList = document.getElementById("post-list");
    const searchBox = document.getElementById("searchBox");

    let allBlogs = []; // store all blogs once

    function renderBlogs(blogs) {
      postList.innerHTML = "";

      if (blogs.length === 0) {
        postList.innerHTML =
          "<p class='col-span-full text-center text-gray-500'>No articles found</p>";
        return;
      }

      blogs.forEach(({ id, blog }) => {
        let thumbnail = blog.imageUrl || 'https://via.placeholder.com/400x200';
        let isVideo = false;

        if (blog.videoLink) {
          try {
            const ytUrl = new URL(blog.videoLink);
            let videoId = "";

            if (ytUrl.hostname === 'youtu.be') {
              videoId = ytUrl.pathname.slice(1);
            } else if (ytUrl.hostname.includes('youtube.com')) {
              videoId = ytUrl.searchParams.get('v');
            }

            if (videoId) {
              thumbnail = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
              isVideo = true;
            }
          } catch (e) { }
        }

        postList.innerHTML += `
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
          <a href="${isVideo ? blog.videoLink : 'view-post.html?id=' + id}" target="${isVideo ? '_blank' : '_self'}">
            <img src="${thumbnail}" class="w-full h-48 object-cover" alt="${blog.title}">
          </a>
          <div class="p-4">
            <h2 class="text-xl font-bold mb-2 hover:text-indigo-600 transition">
              ${blog.title}
            </h2>
            <p class="text-sm text-gray-500 mb-2">
              By ${blog.author || "Unknown"} • ${new Date(blog.date).toLocaleDateString()}
            </p>
            <p class="text-gray-700 mb-4">
              ${blog.content.substring(0, 100)}...
            </p>
            <div class="flex flex-wrap gap-2">
              ${(blog.tags || []).map(tag =>
          `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">${tag}</span>`
        ).join("")}
            </div>
          </div>
        </div>
      `;
      });
    }

    // Load once
    db.collection("blogs")
      .orderBy("date", "desc")
      .get()
      .then(snapshot => {
        allBlogs = snapshot.docs.map(doc => ({
          id: doc.id,
          blog: doc.data()
        }));
        renderBlogs(allBlogs);
      });

    // Search logic
    searchBox.addEventListener("input", () => {
      const q = searchBox.value.toLowerCase().trim();

      const filtered = allBlogs.filter(({ blog }) =>
        blog.title.toLowerCase().includes(q) ||
        blog.content.toLowerCase().includes(q) ||
        (blog.tags || []).some(tag => tag.toLowerCase().includes(q))
      );

      renderBlogs(filtered);
    });
  </script>

</body>

</html>
